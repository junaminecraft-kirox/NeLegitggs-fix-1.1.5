      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ForTablet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ForTablet-apk
          path: ForTablet.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fortablet-${{ github.run_number }}
          name: ForTablet ${{ github.run_number }}
          files: ForTablet.apk

      - name: Where to download
        run: |
          echo "СКАЧАТЬ APK: https://github.com/${{ github.repository }}/releases/tag/fortablet-${{ github.run_number }}"
